<style>
  .t06 { width:430px; height:932px; box-sizing:border-box; overflow:hidden; background:#fff;
    color:#0F1623; font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    display:flex; flex-direction:column; }
  .t06 * { box-sizing:border-box; }
  .t06-sb { height:50px; padding:0 24px 0 30px; display:flex; align-items:center;
    justify-content:space-between; font-size:15px; font-weight:600; }
  .t06-sbr { display:flex; align-items:center; gap:6px; }
  .t06-nav { height:52px; padding:0 18px; display:flex; align-items:center; gap:14px;
    border-bottom:1px solid #EDF0F4; }
  .t06-nt { font-size:17px; font-weight:700; }
  .t06-ns { font-size:11.5px; color:#8A92A1; margin-top:1px; }
  .t06-px { padding:24px 22px 0; }
  .t06-pl { font-size:13px; color:#8A92A1; }
  .t06-pv { font-size:38px; font-weight:750; letter-spacing:-1.2px; margin-top:6px;
    font-variant-numeric:tabular-nums; }
  .t06-pc { font-size:14.5px; font-weight:650; margin-top:6px; color:{{trendColor}}; }
  .t06-ch { padding:16px 12px 0; }
  .t06-rng { display:flex; gap:6px; padding:8px 22px 0; }
  .t06-rg { flex:1; text-align:center; font-size:12.5px; font-weight:600; color:#8A92A1;
    padding:7px 0; border-radius:8px; }
  .t06-rg.on { background:#F1F3F7; color:#0F1623; }
  .t06-card { margin:22px 18px 0; background:#F8F9FB; border:1px solid #EDF0F4;
    border-radius:16px; padding:4px 18px; }
  .t06-ct { font-size:12.5px; color:#8A92A1; padding:16px 0 4px; letter-spacing:.4px;
    text-transform:uppercase; }
  .t06-r { display:flex; justify-content:space-between; align-items:center; padding:13px 0;
    border-bottom:1px solid #EDF0F4; }
  .t06-r:last-child { border-bottom:0; }
  .t06-k { font-size:14px; color:#6B7383; }
  .t06-v { font-size:14.5px; font-weight:650; font-variant-numeric:tabular-nums; }
  .t06-hl { margin:18px 18px 0; border:1.5px solid {{trendColor}}; border-radius:16px;
    padding:18px; display:flex; align-items:center; justify-content:space-between; }
  .t06-hk { font-size:13px; color:#6B7383; }
  .t06-hv { font-size:26px; font-weight:750; letter-spacing:-.8px; margin-top:4px;
    color:{{trendColor}}; font-variant-numeric:tabular-nums; }
  .t06-hp { font-size:19px; font-weight:700; color:{{trendColor}}; }
  .t06-btns { margin-top:auto; padding:0 18px 14px; display:flex; gap:11px; }
  .t06-b { flex:1; height:52px; border-radius:14px; display:flex; align-items:center;
    justify-content:center; font-size:16px; font-weight:700; }
  .t06-buy { background:#16A34A; color:#fff; }
  .t06-sell { background:#fff; border:1.5px solid #DC2626; color:#DC2626; }
  .t06-home { width:140px; height:5px; border-radius:3px; background:#0F1623; opacity:.85;
    margin:0 auto 8px; }
</style>

<div class="t06">
  <div class="t06-sb"><span>{{time}}</span><span class="t06-sbr">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#0F1623"><rect y="7.5" width="3" height="3.5" rx="1"/><rect x="4.6" y="5" width="3" height="6" rx="1"/><rect x="9.2" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.8" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="#0F1623"><path d="M8 10.6 5.6 8.1a3.4 3.4 0 0 1 4.8 0zM3.1 5.7 1.1 3.7a9.8 9.8 0 0 1 13.8 0l-2 2a7 7 0 0 0-9.8 0z"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="#0F1623"><rect x=".5" y=".5" width="22" height="11" rx="3.2" fill="none" stroke="#0F1623" stroke-opacity=".4"/><rect x="2.2" y="2.2" width="17" height="7.6" rx="1.6"/><path d="M24.2 4.2v3.6a2 2 0 0 0 0-3.6z" fill-opacity=".5"/></svg>
  </span></div>

  <div class="t06-nav">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F1623" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    <div><div class="t06-nt">{{code}}</div><div class="t06-ns">{{shortName}}</div></div>
    <svg style="margin-left:auto" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A0A7B4" stroke-width="1.8"><path d="m12 3.5 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 10l6.1-.9z"/></svg>
  </div>

  <div class="t06-px">
    <div class="t06-pl">Güncel fiyat</div>
    <div class="t06-pv">{{symbol}}{{price}}</div>
    <div class="t06-pc">{{pnlPercent}} · maliyete göre</div>
  </div>

  <div class="t06-ch">
    <svg viewBox="0 0 200 60" width="100%" height="150" preserveAspectRatio="none">
      <defs><linearGradient id="g06" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="{{trendColor}}" stop-opacity=".18"/>
        <stop offset="100%" stop-color="{{trendColor}}" stop-opacity="0"/></linearGradient></defs>
      <path d="{{sparkArea}}" fill="url(#g06)"/>
      <path d="{{sparkPath}}" fill="none" stroke="{{trendColor}}" stroke-width="1.8"
        stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>

  <div class="t06-rng">
    <div class="t06-rg">1G</div><div class="t06-rg">1H</div><div class="t06-rg">1A</div>
    <div class="t06-rg on">Tümü</div>
  </div>

  <div class="t06-card">
    <div class="t06-ct">Pozisyonum</div>
    <div class="t06-r"><span class="t06-k">Adet</span><span class="t06-v">{{lot}}</span></div>
    <div class="t06-r"><span class="t06-k">Ortalama maliyet</span><span class="t06-v">{{symbol}}{{cost}}</span></div>
    <div class="t06-r"><span class="t06-k">Maliyet tutarı</span><span class="t06-v">{{symbol}}{{investmentNum}}</span></div>
    <div class="t06-r"><span class="t06-k">Güncel değer</span><span class="t06-v">{{symbol}}{{valueNum}}</span></div>
  </div>

  <div class="t06-hl">
    <div><div class="t06-hk">Toplam kâr / zarar</div><div class="t06-hv">{{pnl}}</div></div>
    <div class="t06-hp">{{pnlPercent}}</div>
  </div>

  <div class="t06-btns">
    <div class="t06-b t06-sell">Sat</div>
    <div class="t06-b t06-buy">Al</div>
  </div>
  <div class="t06-home"></div>
</div>
