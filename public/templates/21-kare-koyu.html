<style>
  .t21 { width:1080px; height:1080px; box-sizing:border-box; overflow:hidden; background:#0B0D11;
    color:#EEF2F7; font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    padding:80px; display:flex; flex-direction:column; }
  .t21 * { box-sizing:border-box; }
  .t21-hd { display:flex; align-items:center; justify-content:space-between;
    padding-bottom:34px; border-bottom:1px solid #1C212A; }
  .t21-b { font-size:30px; font-weight:700; letter-spacing:-.4px; }
  .t21-s { font-size:17px; color:#6F7885; margin-top:8px; }
  .t21-d { font-size:17px; color:#6F7885; }
  .t21-mid { margin:auto 0; display:flex; align-items:center; gap:34px; }
  .t21-img { width:120px; height:120px; border-radius:30px; object-fit:contain; background:#fff;
    padding:12px; flex:none; }
  .t21-av { width:120px; height:120px; border-radius:30px; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:50px; font-weight:800; color:#fff; }
  .t21-c { font-size:58px; font-weight:750; letter-spacing:-1.4px; }
  .t21-n { font-size:21px; color:#6F7885; margin-top:8px; }
  .t21-pblock { margin-top:56px; }
  .t21-pk { font-size:18px; letter-spacing:3.4px; text-transform:uppercase; color:#6F7885; }
  .t21-pv { font-size:112px; font-weight:750; letter-spacing:-4px; line-height:1; margin-top:18px;
    color:{{trendColorDark}}; font-variant-numeric:tabular-nums; }
  .t21-pp { display:inline-flex; align-items:center; gap:12px; margin-top:26px; font-size:32px;
    font-weight:700; color:{{trendColorDark}}; background:{{trendColorSoft}};
    border:1px solid {{trendBorder}}; padding:13px 30px; border-radius:14px; }
  .t21-grid { display:flex; gap:18px; margin-top:56px; }
  .t21-cell { flex:1; background:#12151B; border:1px solid #1C212A; border-radius:20px; padding:24px 26px; }
  .t21-ck { font-size:16px; color:#6F7885; }
  .t21-cv { font-size:29px; font-weight:700; margin-top:10px; font-variant-numeric:tabular-nums; }
  .t21-ft { margin-top:40px; padding-top:26px; border-top:1px solid #1C212A;
    display:flex; justify-content:space-between; font-size:16px; color:#4E5763; }
</style>

<div class="t21">
  <div class="t21-hd">
    <div>
      <div class="t21-b">{{brand}}</div>
      {{#hasSubtitle}}<div class="t21-s">{{subtitle}}</div>{{/hasSubtitle}}
    </div>
    <div class="t21-d">{{date}}</div>
  </div>

  <div>
    <div class="t21-mid">
      {{#hasLogo}}<img class="t21-img" src="{{{logo}}}" alt="">{{/hasLogo}}
      {{^hasLogo}}<div class="t21-av" style="background:{{rowColor}}">{{initial}}</div>{{/hasLogo}}
      <div>
        <div class="t21-c">{{code}}</div>
        <div class="t21-n">{{shortName}}</div>
      </div>
    </div>

    <div class="t21-pblock">
      <div class="t21-pk">Kâr / Zarar</div>
      <div class="t21-pv">{{pnl}}</div>
      <div><span class="t21-pp">{{trendArrow}} {{pnlPercent}}</span></div>
    </div>

    <div class="t21-grid">
      <div class="t21-cell"><div class="t21-ck">Adet</div><div class="t21-cv">{{lot}}</div></div>
      <div class="t21-cell"><div class="t21-ck">Maliyet</div><div class="t21-cv">{{cost}}</div></div>
      <div class="t21-cell"><div class="t21-ck">Güncel</div><div class="t21-cv">{{price}}</div></div>
    </div>
  </div>

  <div class="t21-ft"><span>{{datetime}}</span><span>{{txId}}</span></div>
</div>
